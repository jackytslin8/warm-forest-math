<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖暖森林・數學冒險</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;}
  body{
    min-height:100vh;
    background:linear-gradient(180deg,#87CEEB 0%,#98D8E8 40%,#B5EAD7 70%,#C7F0DB 100%);
    display:flex;align-items:center;justify-content:center;padding:20px;
    overflow:hidden;
  }
  .cloud{position:fixed;background:#fff;border-radius:50px;opacity:.7;animation:float linear infinite;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .c1{width:120px;height:40px;top:8%;left:-120px;animation-duration:45s;}
  .c1::before{width:50px;height:50px;top:-22px;left:18px;}
  .c1::after{width:38px;height:38px;top:-15px;right:20px;}
  .c2{width:90px;height:30px;top:18%;left:-90px;animation-duration:60s;animation-delay:-20s;}
  .c2::before{width:38px;height:38px;top:-17px;left:14px;}
  .c2::after{width:28px;height:28px;top:-11px;right:16px;}
  @keyframes float{to{left:110vw;}}

  #app{
    width:100%;max-width:560px;
    background:rgba(255,255,255,.92);
    border-radius:24px;
    box-shadow:0 12px 40px rgba(46,125,50,.25);
    padding:28px 24px;
    position:relative;z-index:1;
    max-height:92vh;overflow-y:auto;
  }
  h1{text-align:center;font-size:1.6rem;color:#2E7D32;margin-bottom:4px;}
  .sub{text-align:center;color:#66BB6A;font-size:.85rem;margin-bottom:16px;}

  .forest-bar-wrap{background:#E8F5E9;border-radius:20px;height:26px;overflow:hidden;margin-bottom:6px;border:2px solid #A5D6A7;}
  #forestBar{height:100%;width:0%;background:linear-gradient(90deg,#FFB74D,#FFD54F,#FFF176);border-radius:18px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.75rem;color:#5D4037;font-weight:700;}
  .bar-label{display:flex;justify-content:space-between;font-size:.75rem;color:#4CAF50;margin-bottom:14px;}

  .page{display:none;}
  .page.active{display:block;animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  #homePage{text-align:center;padding:16px 0;}
  .forest-emoji{font-size:3rem;margin-bottom:6px;}
  .animal-row{font-size:1.8rem;margin:8px 0;letter-spacing:.3rem;}
  .diff-wrap{margin:16px 0 8px;}
  .diff-label{font-size:.9rem;font-weight:700;color:#2E7D32;margin-bottom:8px;}
  .diff-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .diff-btn{
    padding:10px 20px;border-radius:16px;border:2px solid #A5D6A7;background:#fff;
    font-size:.95rem;font-weight:700;cursor:pointer;transition:all .15s;color:#388E3C;
  }
  .diff-btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(76,175,80,.2);}
  .diff-btn.sel{background:linear-gradient(135deg,#66BB6A,#43A047);color:#fff;border-color:#43A047;box-shadow:0 4px 12px rgba(67,160,71,.35);}
  .diff-desc{font-size:.78rem;color:#7CB342;margin-top:6px;min-height:1.1rem;}
  .btn{
    display:inline-block;padding:12px 36px;margin-top:12px;
    background:linear-gradient(135deg,#66BB6A,#43A047);
    color:#fff;border:none;border-radius:30px;font-size:1.1rem;font-weight:700;
    cursor:pointer;box-shadow:0 6px 16px rgba(67,160,71,.4);transition:transform .15s;
  }
  .btn:hover{transform:scale(1.06);}
  .btn:active{transform:scale(.95);}
  .btn.alt{background:linear-gradient(135deg,#FFB74D,#FB8C00);box-shadow:0 6px 16px rgba(251,140,0,.4);}
  .btn:disabled{opacity:.45;cursor:default;transform:none;}
  .rules{text-align:left;background:#FFF9C4;border-radius:14px;padding:12px 16px;margin-top:14px;font-size:.82rem;color:#5D4037;line-height:1.8;}
  .rules b{color:#E65100;}

  #quizPage .q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .lvl-badge{background:#FFF3E0;color:#E65100;font-weight:700;padding:4px 14px;border-radius:20px;font-size:.82rem;border:2px solid #FFB74D;}
  .score-badge{color:#2E7D32;font-weight:700;font-size:.82rem;}
  .q-animal{text-align:center;font-size:2rem;margin-bottom:2px;}
  .q-text{
    background:#F1F8E9;border:2px solid #C5E1A5;border-radius:16px;
    padding:18px 16px;text-align:center;font-size:1.08rem;color:#33691E;
    margin-bottom:14px;line-height:1.8;min-height:76px;display:flex;align-items:center;justify-content:center;
  }
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opt{
    padding:13px 10px;border-radius:14px;border:2px solid #A5D6A7;
    background:#fff;font-size:1rem;font-weight:600;color:#2E7D32;
    cursor:pointer;transition:all .15s;min-height:50px;
  }
  .opt:hover{background:#E8F5E9;transform:translateY(-2px);box-shadow:0 4px 10px rgba(76,175,80,.2);}
  .opt:active{transform:scale(.96);}
  .opt.correct{background:#C8E6C9;border-color:#43A047;color:#1B5E20;animation:pop .3s;}
  .opt.wrong{background:#FFCDD2;border-color:#E53935;color:#B71C1C;animation:shake .3s;}
  @keyframes pop{50%{transform:scale(1.1);}}
  @keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  #feedback{display:none;text-align:center;margin-top:12px;padding:10px;border-radius:14px;font-size:.9rem;font-weight:600;}
  #feedback.show{display:block;animation:fadeIn .3s;}
  #feedback.ok{background:#E8F5E9;color:#2E7D32;border:2px solid #A5D6A7;}
  #feedback.no{background:#FFEBEE;color:#C62828;border:2px solid #EF9A9A;}
  .next-btn{display:block;width:100%;margin-top:10px;padding:12px;border:none;border-radius:14px;background:#43A047;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;}
  .next-btn:hover{background:#388E3C;}

  #resultPage{text-align:center;padding:14px 0;}
  .result-emoji{font-size:2.8rem;margin-bottom:6px;}
  .result-score{font-size:1.8rem;font-weight:800;color:#2E7D32;margin:6px 0;}
  .result-msg{color:#558B2F;font-size:.92rem;line-height:1.8;margin-bottom:12px;}
  .animal-unlock{background:#FFF9C4;border-radius:14px;padding:10px;margin:8px 0;font-size:.88rem;color:#5D4037;}
  .animal-unlock span{font-size:1.6rem;}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .wrong-list{text-align:left;margin-top:12px;background:#FFF3E0;border-radius:12px;padding:10px 14px;font-size:.8rem;color:#5D4037;line-height:1.9;}
  .wrong-list b{color:#D84315;}

  @media(max-width:420px){.opts{grid-template-columns:1fr;}.btn{padding:12px 28px;}}
</style>
</head>
<body>
<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div id="app">
  <h1>🌳 暖暖森林・數學冒險</h1>
  <div class="sub">用數學溫暖森林，幫小動物回家！</div>

  <div class="forest-bar-wrap"><div id="forestBar">0%</div></div>
  <div class="bar-label"><span>🧊 冰冷的森林</span><span id="warmthText">溫暖度 0%</span><span>🌞 暖暖森林</span></div>

  <!-- 首頁 -->
  <div class="page active" id="homePage">
    <div class="forest-emoji">🌲🌲🦊🐰🐻🌲🌲</div>
    <p style="color:#5D4037;font-size:.9rem;line-height:1.8;">森林變冷了，小動物們都躲了起來。<br>答對<b style="color:#E65100;">數學題</b>，收集陽光，把森林變暖！</p>
    <div class="animal-row">🦊 🐰 🐻 🦉 🐿️</div>

    <div class="diff-wrap">
      <div class="diff-label">🎯 選擇難度（國小五年級）</div>
      <div class="diff-btns">
        <button class="diff-btn sel" id="dEasy" onclick="setDiff('easy')">🌱 基礎</button>
        <button class="diff-btn" id="dNormal" onclick="setDiff('normal')">🌿 標準</button>
        <button class="diff-btn" id="dHard" onclick="setDiff('hard')">🌲 挑戰</button>
      </div>
      <div class="diff-desc" id="diffDesc">基礎：一位數到兩位數，直覺計算，暖暖身</div>
    </div>

    <button class="btn" id="startBtn" onclick="startGame()">☀️ 開始冒險</button>
    <div class="rules">
      <b>📋 遊戲規則</b><br>
      1️⃣ 共 5 關 × 4 題 = 20 題，越後面越難<br>
      2️⃣ 答對 +1 陽光，答錔會顯示正確答案與算式<br>
      3️⃣ 每答對一題，森林溫暖度上升<br>
      4️⃣ 20 題全對，森林完全復原，解鎖全部動物！
    </div>
  </div>

  <!-- 題目頁 -->
  <div class="page" id="quizPage">
    <div class="q-top">
      <span class="lvl-badge" id="lvlBadge">第 1 關</span>
      <span class="score-badge" id="scoreBadge">☀️ 0 / 20</span>
    </div>
    <div class="q-animal" id="qAnimal">🦊</div>
    <div class="q-text" id="qText">題目載入中…</div>
    <div class="opts" id="opts"></div>
    <div id="feedback"></div>
    <button class="next-btn" id="nextBtn" style="display:none" onclick="nextQuestion()">下一題 →</button>
  </div>

  <!-- 結算頁 -->
  <div class="page" id="resultPage">
    <div class="result-emoji" id="resultEmoji">🌳</div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div id="animalUnlock"></div>
    <div id="wrongListWrap"></div>
    <div class="btn-row">
      <button class="btn alt" onclick="startGame()">🔄 再玩一次</button>
      <button class="btn" onclick="goHome()">🏠 換難度</button>
    </div>
  </div>
</div>

<script>
const ANIMALS=["🦊","🐰","🐻","🦉","🐿️","🦔","🐢","🦜"];

/* ============ 三種難度題庫 ============ */
const BANK={
  easy:[
    {q:"小狐狸摘了 12 顆柿子，兔子送來 7 顆。共有幾顆？",a:19,hint:"12 + 7 = ?"},
    {q:"暖爐先生每天燒 5 根木頭，3 天共燒幾根？",a:15,hint:"5 × 3 = ?"},
    {q:"有 20 顆松果，松鼠搬走 8 顆，還剩幾顆？",a:12,hint:"20 − 8 = ?"},
    {q:"15 除以 5 是多少？",a:3,hint:"15 ÷ 5 = ?"},
    {q:"兔子吃了「五分之二」條蛋糕，楓葉鼠吃了「五分之一」條，共吃了幾分之幾條？",a:"5分之3",hint:"2/5 + 1/5 = 3/5"},
    {q:"一條樹根長「八分之七」公尺，剪掉「八分之三」公尺，還剩幾分之幾公尺？",a:"8分之4",hint:"7/8 − 3/8 = 4/8"},
    {q:"「六分之三」約分後等於多少？",a:"2分之1",hint:"分子分母同除以 3"},
    {q:"「四分之三」加「四分之一」等於多少？",a:"1",hint:"3/4 + 1/4 = 4/4 = 1"},
    {q:"一桶楓糖漿重 1.2 公斤，另一桶 0.7 公斤，共重幾公斤？",a:1.9,hint:"1.2 + 0.7 = ?"},
    {q:"一條毛線 5.6 公尺，剪掉 2.1 公尺，還剩幾公尺？",a:3.5,hint:"5.6 − 2.1 = ?"},
    {q:"一袋暖暖包 1.5 公斤，4 袋共幾公斤？",a:6,hint:"1.5 × 4 = ?"},
    {q:"8.4 ÷ 4 = ?",a:2.1,hint:"8.4 ÷ 4 = ?"},
    {q:"長方形草地長 10 公尺、寬 5 公尺，面積幾平方公尺？",a:50,hint:"10 × 5 = ?"},
    {q:"三角形花圃底 8 公尺、高 4 公尺，面積幾平方公尺？",a:16,hint:"8 × 4 ÷ 2 = ?"},
    {q:"正方體邊長 3 公分，體積幾立方公分？",a:27,hint:"3 × 3 × 3 = ?"},
    {q:"從家裡到森林 2 公里（2000 公尺），每分鐘走 100 公尺，要幾分鐘？",a:20,hint:"2000 ÷ 100 = ?"},
    {q:"6 和 9 的最大公因數是多少？",a:3,hint:"6 的因數：1,2,3,6；9 的因數：1,3,9"},
    {q:"2 和 5 的最小公倍數是多少？",a:10,hint:"2 的倍數：2,4,6,8,10…；5 的倍數：5,10…"},
    {q:"一件毛衣 200 元，打八折（80%）後賣幾元？",a:160,hint:"200 × 0.8 = ?"},
    {q:"「2 公里 300 公尺」合起來是幾公尺？",a:2300,hint:"2 公里 = 2000 公尺"}
  ],
  normal:[
    {q:"小狐狸摘了 24 顆柿子，兔子送來 18 顆，楓葉鼠偷走 9 顆。還剩幾顆？",a:33,hint:"24 + 18 − 9 = ?"},
    {q:"森林裡有 15 棵松樹，每棵 12 顆松果，松鼠搬走 47 顆。還剩幾顆？",a:133,hint:"15 × 12 − 47 = ?"},
    {q:"暖爐先生每天燒 7 根木頭，一週（7 天）共燒幾根？",a:49,hint:"7 × 7 = ?"},
    {q:"135 除以 5 是多少？",a:27,hint:"135 ÷ 5 = ?"},
    {q:"兔子吃了「五分之二」條蛋糕，楓葉鼠吃了「五分之一」條。兩人共吃了幾分之幾條？",a:"5分之3",hint:"2/5 + 1/5 = 3/5"},
    {q:"一條樹根長「八分之七」公尺，剪掉「八分之三」公尺。還剩幾分之幾公尺？",a:"8分之4",hint:"7/8 − 3/8 = 4/8"},
    {q:"「六分之三」約分後等於多少？",a:"2分之1",hint:"分子分母同除以 3"},
    {q:"把「四分之三」和「四分之一」相加，答案是？",a:"1",hint:"3/4 + 1/4 = 4/4 = 1"},
    {q:"一桶楓糖漿重 2.45 公斤，另一桶 1.8 公斤。共重幾公斤？",a:4.25,hint:"2.45 + 1.8 = ?（小數點對齊）"},
    {q:"一條毛線 6.4 公尺，剪掉 2.85 公尺。還剩幾公尺？",a:3.55,hint:"6.4 − 2.85 = ?"},
    {q:"一袋暖暖包 2.5 公斤，4 袋共幾公斤？",a:10,hint:"2.5 × 4 = ?"},
    {q:"12.6 ÷ 3 = ?",a:4.2,hint:"12.6 ÷ 3 = ?"},
    {q:"長方形草地長 12 公尺、寬 8 公尺，面積幾平方公尺？",a:96,hint:"12 × 8 = ?"},
    {q:"三角形花圃底 10 公尺、高 6 公尺，面積幾平方公尺？",a:30,hint:"10 × 6 ÷ 2 = ?"},
    {q:"正方體邊長 4 公分，體積幾立方公分？",a:64,hint:"4 × 4 × 4 = ?"},
    {q:"從家裡到森林 3 公里（3000 公尺），每分鐘走 150 公尺，要幾分鐘？",a:20,hint:"3000 ÷ 150 = ?"},
    {q:"12 和 18 的最大公因數是多少？",a:6,hint:"12 的因數：1,2,3,4,6,12；18 的因數：1,2,3,6,9,18"},
    {q:"4 和 6 的最小公倍數是多少？",a:12,hint:"4 的倍數：4,8,12…；6 的倍數：6,12…"},
    {q:"森林商店一件毛衣 400 元，打八折（80%）後賣幾元？",a:320,hint:"400 × 0.8 = ?"},
    {q:"「3 公里 450 公尺」合起來是幾公尺？",a:3450,hint:"3 公里 = 3000 公尺"}
  ],
  hard:[
    {q:"小狐狸摘了 36 顆柿子，兔子送來 27 顆，楓葉鼠偷走 14 顆，又撿回 8 顆。現在幾顆？",a:57,hint:"36 + 27 − 14 + 8 = ?"},
    {q:"森林裡有 24 棵松樹，每棵 15 顆松果。松鼠搬走 132 顆，還剩幾顆？",a:228,hint:"24 × 15 − 132 = ?"},
    {q:"暖爐先生每週燒 48 根木頭，平均每天燒幾根？（一週 7 天）",a:"48÷7 約 6.86",hint:"48 ÷ 7 ≈ 6.86"},
    {q:"234 除以 6 是多少？",a:39,hint:"234 ÷ 6 = ?"},
    {q:"兔子吃了「六分之五」條蛋糕，楓葉鼠吃了「三分之二」條。兩人共吃了幾分之幾條？（通分）",a:"6分之9",hint:"5/6 + 4/6 = 9/6"},
    {q:"一條樹根長「十二分之十一」公尺，剪掉「四分之一」公尺。還剩幾分之幾公尺？（通分）",a:"12分之8",hint:"11/12 − 3/12 = 8/12"},
    {q:"「十八分之十二」約分後等於多少？",a:"3分之2",hint:"分子分母同除以 6"},
    {q:"「六分之五」加「四分之三」等於多少？（通分）",a:"12分之19",hint:"10/12 + 9/12 = 19/12"},
    {q:"三桶楓糖漿分別重 3.75、2.6、1.85 公斤。共重幾公斤？",a:8.2,hint:"3.75 + 2.6 + 1.85 = ?"},
    {q:"一條毛線 10.5 公尺，剪掉 3.75 公尺，再剪掉 2.4 公尺。還剩幾公尺？",a:4.35,hint:"10.5 − 3.75 − 2.4 = ?"},
    {q:"一袋暖暖包 3.25 公斤，6 袋共幾公斤？",a:19.5,hint:"3.25 × 6 = ?"},
    {q:"37.8 ÷ 4.5 = ?",a:8.4,hint:"37.8 ÷ 4.5 = ?"},
    {q:"平行四邊形草地底 14 公尺、高 9 公尺，面積幾平方公尺？",a:126,hint:"底 × 高 = ?"},
    {q:"三角形花圃底 12 公尺、高 7 公尺，面積幾平方公尺？",a:42,hint:"12 × 7 ÷ 2 = ?"},
    {q:"長方體長 6 公分、寬 4 公分、高 5 公分，體積幾立方公分？",a:120,hint:"6 × 4 × 5 = ?"},
    {q:"從家裡到森林 4.5 公里，騎車每分鐘 300 公尺，要幾分鐘？",a:15,hint:"4500 ÷ 300 = ?"},
    {q:"24 和 36 的最大公因數是多少？",a:12,hint:"24 的因數：1,2,3,4,6,8,12,24；36 的因數：1,2,3,4,6,9,12,18,36"},
    {q:"6 和 8 的最小公倍數是多少？",a:24,hint:"6 的倍數：6,12,18,24…；8 的倍數：8,16,24…"},
    {q:"森林商店一件毛衣 500 元，先打九折（90%），再用折價券再扣 50 元。最後賣幾元？",a:400,hint:"500 × 0.9 = 450；450 − 50 = ?"},
    {q:"「5 公里 120 公尺」合起來是幾公尺？",a:5120,hint:"5 公里 = 5000 公尺"}
  ]
};

const DIFF_INFO={
  easy:{name:"🌱 基礎",desc:"一位數到兩位數，直覺計算，暖暖身"},
  normal:{name:"🌿 標準",desc:"課本難度，小數兩位、三位數計算"},
  hard:{name:"🌲 挑戰",desc:"通分、多步驟應用題，推理解題"}
};

let diff="easy",qi=0,score=0,wrongAns=[],answered=false;

function setDiff(d){
  diff=d;
  ["easy","normal","hard"].forEach(k=>{
    document.getElementById("d"+k[0].toUpperCase()+k.slice(1)).classList.toggle("sel",k===d);
  });
  document.getElementById("diffDesc").textContent=DIFF_INFO[d].desc;
}

function startGame(){
  qi=0;score=0;wrongAns=[];answered=false;
  show("quizPage");
  renderQuestion();
}
function goHome(){show("homePage");updateBar();}

function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function renderQuestion(){
  answered=false;
  const pool=BANK[diff];
  const q=pool[qi];
  const lvl=Math.floor(qi/4)+1;
  document.getElementById("lvlBadge").textContent=`第 ${lvl} 關 · ${DIFF_INFO[diff].name}`;
  document.getElementById("scoreBadge").textContent=`☀️ ${score} / 20`;
  document.getElementById("qAnimal").textContent=ANIMALS[lvl-1];
  document.getElementById("qText").innerHTML=q.q;
  const box=document.getElementById("opts");
  box.innerHTML="";
  // 產生選項：正解 + 3 個干擾項
  const correct=String(q.a);
  let opts=new Set([correct]);
  let base=parseFloat(q.a);
  while(opts.size<4){
    let wrong;
    if(isNaN(base)){
      // 分數類：分子分母微調
      let m=q.a.match(/^(\d+)分之(\d+)$/);
      if(m){
        let d=+m[1],n=+m[2];
        let pick=Math.random();
        if(pick<.4)wrong=`${d}分之${n+1}`;
        else if(pick<.7)wrong=`${d}分之${n-1}`;
        else wrong=`${d+1}分之${n}`;
      }else{
        wrong="1";
      }
    }else{
      let delta=Math.max(1,Math.round(Math.abs(base)*0.15));
      let pick=Math.random();
      if(pick<.5)wrong=base+delta;
      else if(pick<.8)wrong=base-delta;
      else wrong=base+delta*2;
      // 處理整數題不要出現小數
      if(Number.isInteger(base))wrong=Math.round(wrong);
      wrong=String(wrong);
    }
    if(wrong!==correct)opts.add(String(wrong));
  }
  const shuffled=[...opts].sort(()=>Math.random()-.5);
  shuffled.forEach(o=>{
    const b=document.createElement("button");
    b.className="opt";b.textContent=o;
    b.onclick=()=>checkAnswer(o,b);
    box.appendChild(b);
  });
  document.getElementById("feedback").className="";
  document.getElementById("nextBtn").style.display="none";
}

function checkAnswer(val,btn){
  if(answered)return;answered=true;
  const pool=BANK[diff];
  const q=pool[qi];
  const correct=String(val)===String(q.a);
  const fb=document.getElementById("feedback");
  const allBtns=document.querySelectorAll(".opt");
  if(correct){
    score++;
    btn.classList.add("correct");
    fb.textContent=`答對了！☀️ ${q.hint}`;
    fb.className="show ok";
  }else{
    btn.classList.add("wrong");
    allBtns.forEach(b=>{if(String(b.textContent)===String(q.a))b.classList.add("correct");});
    fb.textContent=`答案是「${q.a}」。${q.hint}`;
    fb.className="show no";
    wrongAns.push({q:q.q,a:q.a});
  }
  updateBar();
  document.getElementById("nextBtn").style.display="block";
  document.getElementById("nextBtn").textContent=(qi===19)?"看結果 →":"下一題 →";
}

function nextQuestion(){
  if(qi<19){qi++;renderQuestion();}
  else showResult();
}

function updateBar(){
  const pct=Math.round(score/20*100);
  document.getElementById("forestBar").style.width=pct+"%";
  document.getElementById("forestBar").textContent=pct+"%";
  document.getElementById("warmthText").textContent=`溫暖度 ${pct}%`;
}

function showResult(){
  show("resultPage");
  updateBar();
  document.getElementById("resultScore").textContent=`答對 ${score} / 20 題`;
  let emoji,msg,unlock;
  if(score===20){emoji="🌳🌟";msg="太厲害了！森林完全復原，陽光灑滿每一棵樹！";unlock="🦊🐰🐻🦉🐿️🦔🐢🦜 全部動物都回來了！";}
  else if(score>=16){emoji="🌳🌳";msg="森林已經好暖好暖了！動物們都跑出來曬太陽！";unlock="🦊🐰🐻🦉🐿️ 大部分動物都回來了！";}
  else if(score>=10){emoji="🌲🌱";msg="森林慢慢變暖了，再努力一下，動物們就快回來！";unlock="🦊🐰 幾隻動物探出頭來了！";}
  else if(score>=5){emoji="🌱";msg="陽光開始穿透雲層，繼續加油！";unlock="🦊 小狐狸偷偷看了一下…";}
  else{emoji="🧊";msg="森林還很冷呢，多練習，下次一定可以！";unlock="❄️ 動物們還在躲雪，再試一次吧！";}
  document.getElementById("resultEmoji").textContent=emoji;
  document.getElementById("resultMsg").textContent=msg;
  document.getElementById("animalUnlock").innerHTML=`<div class="animal-unlock"><span>🎉</span> ${unlock}</div>`;
  const wl=document.getElementById("wrongListWrap");
  if(wrongAns.length){
    wl.innerHTML=`<div class="wrong-list"><b>📝 答錯的題目（${wrongAns.length} 題）</b><br>`+
      wrongAns.map((w,i)=>`${i+1}. ${w.q}<br>　→ 正確答案：<b>${w.a}</b>`).join("<br>")+`</div>`;
  }else wl.innerHTML="";
}
</script>
